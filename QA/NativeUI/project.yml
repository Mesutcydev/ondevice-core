name: NativeUIReview
options:
  developmentLanguage: en
  knownRegions: [en, hi, de, es, ar, tr, ja, fr, pt, it, el, ro, ru, zh-Hans, ko]
  deploymentTarget:
    iOS: '27.0'
packages:
  OnDeviceUI:
    path: ../../Packages/OnDeviceUI
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '8'
    MARKETING_VERSION: '2.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  NativeUIReview:
    type: application
    platform: iOS
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Token AI QA
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "8"
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tokenai]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    sources:
      - path: ReviewApp.swift
      - path: DownloadActivityReview.swift
      - path: ../../Shared/DownloadActivityAttributes.swift
      - path: ../../Shared/DownloadActivityContent.swift
      - path: ../../IOSLocalLLM/Services/DownloadLiveActivity.swift
