      - path: ../../IOSLocalLLM/Services/CoreAIModelLibrary.swift
      - path: ../../IOSLocalLLM/Views/Bridge/LocalAPIServerView.swift
      - path: ../../IOSLocalLLM/Models/LocalAPIClientSetup.swift
      - path: ../../IOSLocalLLM/Views/HomeView.swift
      - path: ../../IOSLocalLLM/Views/ChatResponseActions.swift
      - path: ../../IOSLocalLLM/Views/WorkbenchSelectionObserver.swift
      - path: ../../IOSLocalLLM/Views/ChatThreadEmptyState.swift
      - path: ../../IOSLocalLLM/Views/BootSplashView.swift
      - path: ../../IOSLocalLLM/Views/OnboardingOnePager.swift
      - path: ../../IOSLocalLLM/Views/ImageGenerationView.swift
      - path: ../../IOSLocalLLM/Models/ConversationStore.swift
      - path: ../../IOSLocalLLM/Models/PresentationRequestLifetime.swift
      - path: ../../IOSLocalLLM/Models/CaptureSessionDemand.swift
      - path: ../../IOSLocalLLM/Models/ChatMessage.swift
      - path: ../../IOSLocalLLM/Models/ChatTemplate.swift
      - path: ../../IOSLocalLLM/Models/LFM3ToolProtocol.swift
      - path: ../../IOSLocalLLM/Models/AssistantOutputSanitizer.swift
      - path: ../../IOSLocalLLM/Models/AssistantReplyPresentation.swift
      - path: ../../IOSLocalLLM/Models/StudioTextBlocks.swift
      - path: ../../IOSLocalLLM/Models/TokenLogprob.swift
      - path: ../../IOSLocalLLM/Models/ApplePrivateCloudTypes.swift
      - path: ../../IOSLocalLLM/Services/EntitlementsProbe.swift
      - path: ../../IOSLocalLLM/Services/FileAttachmentService.swift
      - path: ../../Packages/OnDeviceUI/Example/OnDeviceUIDemo/Resources/studio-example.png
    dependencies:
      - package: OnDeviceUI
      - target: DownloadActivityReviewExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.OnDeviceNativeUIReview
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  DownloadActivityReviewExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../Packages/OnDeviceUI/Sources/OnDeviceUI/Resources/Localizable.xcstrings
      - path: ../../DownloadActivityExtension/DownloadActivityWidget.swift
      - path: ../../Shared/DownloadActivityAttributes.swift
      - path: ../../Shared/DownloadActivityContent.swift
    info:
      path: DownloadActivityReview-Info.plist
      properties:
        CFBundleDisplayName: Download Activity Review
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "8"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.OnDeviceNativeUIReview.downloads
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  HostContracts:
    type: bundle.unit-test
    platform: iOS
    sources: [HostContracts]
    dependencies:
      - target: NativeUIReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.OnDeviceNativeUIReview.contracts
  NativeUIFlows:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: NativeUIReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.OnDeviceNativeUIReview.flows
schemes:
  NativeUIReview:
    build:
      targets:
        NativeUIReview: all
    test:
      targets:
        - HostContracts
        - NativeUIFlows
