      - path: ../../IOSLocalLLM/Views/Assistant/AssistantToolPresentation.swift
      - path: ../../IOSLocalLLM/Views/PhotoPickerView.swift
      - path: ../../IOSLocalLLM/Services/ParentalControlManager.swift
